name: Build NightHelper APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (signed if secrets exist, debug otherwise)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore from secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/nighthelper.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded from secrets — building a signed release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KEYSTORE_BASE64 secret found — falling back to a debug-signed APK."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nighthelper.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback, no signing secrets)
        if: steps.signing.outputs.signed == 'false'
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK for artifact and release
        run: |
          mkdir -p dist
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk dist/NightHelper.apk
          elif compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk dist/NightHelper.apk
          else
            echo "No APK found!" && exit 1
          fi
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightHelper-APK
          path: dist/NightHelper.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: NightHelper — Latest APK
          body: |
            NightHelper — چک‌لیست هوشمند شب

            آخرین نسخه‌ی خودکار بیلدشده از شاخه‌ی main.

            - فایل `NightHelper.apk` را دانلود و نصب کن.
            - اگر اعلان «ناشناخته» دیدی، اجازه‌ی نصب از این منبع را بده.
          prerelease: true
          files: dist/NightHelper.apk
